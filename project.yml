# XcodeGen 配置。修改后运行 `xcodegen generate` 重新生成 Hachibu.xcodeproj（不提交）。
# 构建设置写在 Config/Base.xcconfig，这里只描述工程结构。
name: Hachibu
options:
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  HachibuKit:
    path: Packages/HachibuKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Hachibu:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
      # 特权 helper 的 LaunchDaemon plist，SMAppService.daemon 从这里注册，见 docs/v1技术设计.md 21.3。
      - path: Helper/io.github.nanvon.hachibu.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: HachibuHelper
        embed: true
        copy:
          destination: executables
      - package: HachibuKit
        product: BatteryCore
      - package: HachibuKit
        product: HistoryStore
      - package: HachibuKit
        product: FeatureUI
      - package: Sparkle
    scheme: {}

  # 特权 helper：以 root 运行，只修改充电上限。嵌入 App 的 Contents/MacOS。
  HachibuHelper:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/Helper.xcconfig
      Release: Config/Helper.xcconfig
    sources:
      - path: Helper/main.swift
    dependencies:
      - package: HachibuKit
        product: BatteryCore
